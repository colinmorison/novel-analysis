server.port=8080

spring.application.name=novel-analysis

# ================= PostgreSQL =================
# 本地开发默认值，真实配置请通过环境变量或 application-local.properties 覆盖
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:5432/${PG_DB:novel_analysis}
spring.datasource.username=${PG_USER:postgres}
spring.datasource.password=${PG_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA / MyBatis-Plus
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis.mapper-locations=classpath*:/mapper/**/*.xml

# 初始化 SQL
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ================= Neo4j =================
spring.neo4j.uri=bolt://${NEO4J_HOST:localhost}:7687
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:password}

# ================= Redis =================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DB:0}
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ================= Kafka =================
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=novel-analysis-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# ================= MinIO =================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:novel-bucket}

# ================= LangChain4j Ollama (本地调试默认) =================
langchain4j.ollama.chat-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.chat-model.model-name=${OLLAMA_CHAT_MODEL:qwen3.5:4b}
langchain4j.ollama.chat-model.temperature=0.3
langchain4j.ollama.chat-model.timeout=PT120S
langchain4j.ollama.chat-model.log-requests=true
langchain4j.ollama.chat-model.log-responses=true

langchain4j.ollama.embedding-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.embedding-model.model-name=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
langchain4j.ollama.embedding-model.timeout=PT120S

# 业务配置
novel.ai.provider=${AI_PROVIDER:ollama}
novel.parse.chunk-size=${PARSE_CHUNK_SIZE:500}
novel.parse.chunk-overlap=${PARSE_CHUNK_OVERLAP:100}
novel.parse.max-file-size-mb=${MAX_FILE_SIZE_MB:50}
